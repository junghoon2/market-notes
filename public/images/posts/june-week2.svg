<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="35%" style="stop-color:#3b0764"/>
      <stop offset="60%" style="stop-color:#7c2d12"/>
      <stop offset="80%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="74%" r="32%">
      <stop offset="0%" style="stop-color:#fef9c3;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#fbbf24;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#fef9c3;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#7c2d12;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.55"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0b1120"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="beamblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 태양 후광 -->
  <ellipse cx="400" cy="440" rx="360" ry="210" fill="url(#sun)" filter="url(#glow)"/>
  <ellipse cx="400" cy="440" rx="200" ry="120" fill="#fef9c3" opacity="0.15" filter="url(#glow)"/>

  <!-- 별 (상단 어두운 영역) -->
  <g fill="white">
    <circle cx="55" cy="38" r="1.0" opacity="0.7"/>
    <circle cx="125" cy="20" r="0.8" opacity="0.6"/>
    <circle cx="205" cy="52" r="1.2" opacity="0.8"/>
    <circle cx="285" cy="28" r="0.7" opacity="0.5"/>
    <circle cx="365" cy="44" r="0.9" opacity="0.6"/>
    <circle cx="445" cy="22" r="1.1" opacity="0.7"/>
    <circle cx="525" cy="56" r="0.8" opacity="0.5"/>
    <circle cx="605" cy="32" r="1.3" opacity="0.8"/>
    <circle cx="685" cy="50" r="0.9" opacity="0.6"/>
    <circle cx="755" cy="24" r="1.0" opacity="0.7"/>
    <circle cx="90" cy="84" r="0.7" opacity="0.5"/>
    <circle cx="175" cy="98" r="1.0" opacity="0.6"/>
    <circle cx="335" cy="88" r="0.8" opacity="0.4"/>
    <circle cx="495" cy="92" r="0.9" opacity="0.5"/>
    <circle cx="645" cy="80" r="1.1" opacity="0.6"/>
    <circle cx="735" cy="98" r="0.7" opacity="0.4"/>
    <circle cx="270" cy="120" r="0.8" opacity="0.4"/>
    <circle cx="560" cy="128" r="0.9" opacity="0.5"/>
  </g>

  <!-- 밝은 별 -->
  <g fill="white" filter="url(#starblur)">
    <circle cx="205" cy="52" r="2.2" opacity="0.9"/>
    <circle cx="605" cy="32" r="2.5" opacity="0.9"/>
    <circle cx="445" cy="22" r="2.0" opacity="0.8"/>
  </g>

  <!-- 십자형 별빛 -->
  <g stroke="white" stroke-width="0.6" opacity="0.5">
    <line x1="605" y1="25" x2="605" y2="39"/>
    <line x1="598" y1="32" x2="612" y2="32"/>
  </g>

  <!-- 빛을 받는 구름 -->
  <g opacity="0.5">
    <ellipse cx="190" cy="185" rx="120" ry="24" fill="#a855f7" opacity="0.4"/>
    <ellipse cx="610" cy="165" rx="130" ry="22" fill="#a855f7" opacity="0.35"/>
    <ellipse cx="150" cy="255" rx="100" ry="20" fill="#f97316" opacity="0.3"/>
    <ellipse cx="650" cy="245" rx="110" ry="18" fill="#f97316" opacity="0.3"/>
    <ellipse cx="350" cy="305" rx="140" ry="14" fill="#fbbf24" opacity="0.22"/>
  </g>

  <!-- 단독으로 솟구치는 강한 빛줄기 (한 종목이 끌어올린 상승) -->
  <polygon points="370,440 430,440 470,40 330,40" fill="url(#beam)" opacity="0.7" filter="url(#beamblur)"/>
  <polygon points="388,440 412,440 425,70 375,70" fill="#fffbeb" opacity="0.35" filter="url(#beamblur)"/>

  <!-- 원경 산 -->
  <polygon points="0,420 80,360 160,390 250,340 350,370 450,320 550,350 650,310 750,340 800,360 800,480 0,480" fill="url(#mountain2)" opacity="0.7"/>

  <!-- 전경 산 -->
  <polygon points="0,480 60,430 140,460 230,400 320,440 400,388 480,420 560,380 650,410 730,370 800,400 800,600 0,600" fill="url(#mountain1)"/>

  <!-- 산 위 빛 반사 -->
  <polygon points="230,400 255,370 280,400" fill="#fbbf24" opacity="0.15"/>
  <polygon points="400,388 425,356 450,388" fill="#fbbf24" opacity="0.22"/>
  <polygon points="560,380 585,350 610,380" fill="#fbbf24" opacity="0.15"/>
  <polygon points="730,370 755,342 780,370" fill="#fbbf24" opacity="0.18"/>

  <!-- 떠오르는 태양 -->
  <ellipse cx="400" cy="388" rx="52" ry="52" fill="url(#suncore)"/>
  <ellipse cx="400" cy="388" rx="68" ry="68" fill="#fbbf24" opacity="0.3" filter="url(#softglow)"/>

  <!-- 수평선 위 빛줄기 -->
  <g stroke="#fef9c3" stroke-width="1" opacity="0.15">
    <line x1="400" y1="388" x2="100" y2="310"/>
    <line x1="400" y1="388" x2="220" y2="295"/>
    <line x1="400" y1="388" x2="320" y2="285"/>
    <line x1="400" y1="388" x2="480" y2="285"/>
    <line x1="400" y1="388" x2="580" y2="295"/>
    <line x1="400" y1="388" x2="700" y2="310"/>
  </g>

  <!-- 물 반사 -->
  <rect x="0" y="480" width="800" height="120" fill="url(#water)"/>
  <ellipse cx="400" cy="510" rx="210" ry="15" fill="#fbbf24" opacity="0.25"/>
  <ellipse cx="400" cy="532" rx="150" ry="8" fill="#fef9c3" opacity="0.15"/>
  <ellipse cx="400" cy="552" rx="85" ry="5" fill="#fbbf24" opacity="0.1"/>

  <!-- 전경 나무 실루엣 -->
  <g fill="#0b1120">
    <polygon points="18,600 33,520 48,600"/>
    <polygon points="48,600 66,508 84,600"/>
    <polygon points="712,600 730,513 748,600"/>
    <polygon points="747,600 764,503 781,600"/>
    <polygon points="777,600 792,523 807,600"/>
  </g>
</svg>
