<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 배경: 3주 하락의 어둠에서 여명으로 넘어가는 하늘 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c1c"/>
      <stop offset="34%" stop-color="#0e1730"/>
      <stop offset="58%" stop-color="#1d2547"/>
      <stop offset="78%" stop-color="#3c3352"/>
      <stop offset="92%" stop-color="#7a4a4a"/>
      <stop offset="100%" stop-color="#b8763c"/>
    </linearGradient>
    <!-- 지평선에서 번지는 여명 -->
    <radialGradient id="dawn" cx="50%" cy="100%" r="72%">
      <stop offset="0%" stop-color="#ffd79a" stop-opacity="0.85"/>
      <stop offset="34%" stop-color="#f0954a" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#7b4b6a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1d2547" stop-opacity="0"/>
    </radialGradient>
    <!-- 떠오르는 해 -->
    <radialGradient id="sunOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6dc" stop-opacity="1"/>
      <stop offset="38%" stop-color="#ffc46a" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#e07a2c" stop-opacity="0"/>
    </radialGradient>
    <!-- 골을 찍고 되돌아 올라오는 궤적 -->
    <linearGradient id="reboundTrail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f7fae" stop-opacity="0.10"/>
      <stop offset="42%" stop-color="#8fb4dd" stop-opacity="0.45"/>
      <stop offset="72%" stop-color="#ffd08a" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#fff0c8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2438"/>
      <stop offset="45%" stop-color="#191f36"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1f38"/>
      <stop offset="52%" stop-color="#2a2442"/>
      <stop offset="100%" stop-color="#1a1f38"/>
    </linearGradient>
    <filter id="softblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="starblur" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="trailblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 배경 하늘 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#dawn)"/>

  <!-- 별: 위쪽일수록 밝고 지평선으로 갈수록 옅어진다 -->
  <g fill="#e8f0ff">
    <circle cx="44" cy="38" r="1.4" opacity="0.8"/>
    <circle cx="96" cy="96" r="0.9" opacity="0.55"/>
    <circle cx="152" cy="30" r="1.7" opacity="0.9"/>
    <circle cx="198" cy="82" r="1" opacity="0.58"/>
    <circle cx="238" cy="24" r="1.2" opacity="0.72"/>
    <circle cx="284" cy="118" r="0.8" opacity="0.46"/>
    <circle cx="326" cy="52" r="1.5" opacity="0.84"/>
    <circle cx="368" cy="104" r="1" opacity="0.52"/>
    <circle cx="410" cy="28" r="1.1" opacity="0.68"/>
    <circle cx="448" cy="132" r="0.9" opacity="0.44"/>
    <circle cx="496" cy="62" r="1.4" opacity="0.76"/>
    <circle cx="534" cy="20" r="0.9" opacity="0.52"/>
    <circle cx="576" cy="112" r="1.2" opacity="0.6"/>
    <circle cx="618" cy="46" r="1" opacity="0.56"/>
    <circle cx="662" cy="92" r="1.5" opacity="0.72"/>
    <circle cx="704" cy="26" r="0.9" opacity="0.48"/>
    <circle cx="742" cy="78" r="1.2" opacity="0.62"/>
    <circle cx="778" cy="36" r="1" opacity="0.5"/>
    <circle cx="20" cy="126" r="1.3" opacity="0.6"/>
    <circle cx="70" cy="168" r="0.9" opacity="0.4"/>
    <circle cx="132" cy="204" r="1.1" opacity="0.44"/>
    <circle cx="184" cy="152" r="0.8" opacity="0.34"/>
    <circle cx="252" cy="188" r="1" opacity="0.4"/>
    <circle cx="308" cy="216" r="0.9" opacity="0.34"/>
    <circle cx="382" cy="176" r="1.1" opacity="0.4"/>
    <circle cx="460" cy="204" r="0.8" opacity="0.32"/>
    <circle cx="528" cy="164" r="1" opacity="0.38"/>
    <circle cx="596" cy="198" r="0.9" opacity="0.32"/>
    <circle cx="678" cy="158" r="1.1" opacity="0.4"/>
    <circle cx="754" cy="192" r="0.8" opacity="0.3"/>
    <circle cx="34" cy="238" r="0.9" opacity="0.26"/>
    <circle cx="118" cy="268" r="0.8" opacity="0.22"/>
    <circle cx="212" cy="248" r="0.9" opacity="0.24"/>
    <circle cx="296" cy="282" r="0.7" opacity="0.2"/>
    <circle cx="436" cy="256" r="0.8" opacity="0.22"/>
    <circle cx="572" cy="276" r="0.9" opacity="0.22"/>
    <circle cx="656" cy="244" r="0.7" opacity="0.2"/>
    <circle cx="736" cy="270" r="0.9" opacity="0.22"/>
  </g>

  <!-- 밝은 별 (십자 광채) -->
  <g filter="url(#starblur)" fill="#ffffff">
    <circle cx="152" cy="30" r="2.7" opacity="0.9"/>
    <circle cx="326" cy="52" r="2.3" opacity="0.82"/>
    <circle cx="662" cy="92" r="2.5" opacity="0.86"/>
  </g>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.55">
    <path d="M152 19 L152 41 M141 30 L163 30" stroke-width="1.1"/>
    <path d="M662 82 L662 102 M652 92 L672 92" stroke-width="1"/>
  </g>

  <!-- 지평선 위로 막 올라온 해 -->
  <circle cx="400" cy="474" r="190" fill="url(#sunOrb)" filter="url(#softblur)" opacity="0.9"/>
  <circle cx="400" cy="474" r="46" fill="#ffe9bc" opacity="0.96"/>
  <circle cx="400" cy="474" r="70" fill="#ffcf88" opacity="0.28"/>

  <!-- 반등 궤적: 왼쪽에서 골을 찍고 오른쪽 위로 -->
  <g fill="none" stroke-linecap="round" filter="url(#trailblur)">
    <path d="M44 226 C 116 292, 176 376, 248 404 C 320 430, 392 372, 466 292 C 540 214, 640 148, 764 108"
          stroke="url(#reboundTrail)" stroke-width="6" opacity="0.9"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M44 226 C 116 292, 176 376, 248 404 C 320 430, 392 372, 466 292 C 540 214, 640 148, 764 108"
          stroke="#ffe6b4" stroke-width="1.7" opacity="0.62"/>
  </g>
  <!-- 저점: 3주 하락이 멈춘 자리 -->
  <circle cx="266" cy="410" r="16" fill="#8fb4dd" opacity="0.2" filter="url(#softblur)"/>
  <circle cx="266" cy="410" r="4.2" fill="#dcecff" opacity="0.85"/>
  <!-- 궤적 끝: 이번 주 도달점 -->
  <circle cx="764" cy="108" r="20" fill="#ffd08a" opacity="0.3" filter="url(#softblur)"/>
  <circle cx="764" cy="108" r="5" fill="#fff4d6" opacity="0.95"/>

  <!-- 능선: 뒤쪽 -->
  <path d="M0 468 L86 418 L158 448 L242 400 L318 442 L400 404 L484 444 L566 402 L652 442 L738 408 L800 428 L800 486 L0 486 Z"
        fill="url(#ridgeFar)" opacity="0.88"/>
  <!-- 능선: 앞쪽 -->
  <path d="M0 500 L78 462 L154 492 L236 454 L316 494 L400 462 L488 498 L570 460 L660 496 L746 464 L800 484 L800 512 L0 512 Z"
        fill="#0b1020" opacity="0.96"/>

  <!-- 수면 -->
  <rect y="512" width="800" height="88" fill="url(#water)"/>
  <!-- 해의 수면 반사 -->
  <g opacity="0.55" fill="#ffd79a">
    <ellipse cx="400" cy="522" rx="62" ry="5"/>
    <ellipse cx="400" cy="538" rx="48" ry="3.8"/>
    <ellipse cx="400" cy="554" rx="34" ry="3"/>
    <ellipse cx="400" cy="572" rx="22" ry="2.4"/>
    <ellipse cx="400" cy="588" rx="13" ry="1.8"/>
  </g>

  <!-- 수면 잔물결 -->
  <g stroke="#7c93b8" stroke-width="0.8" opacity="0.16" stroke-linecap="round">
    <path d="M46 524 h62 M148 536 h50 M256 520 h56 M498 528 h60 M614 518 h46 M706 534 h62"/>
    <path d="M84 566 h54 M204 558 h62 M296 578 h46 M520 562 h58 M676 580 h58"/>
  </g>

  <!-- 하단 비네트 -->
  <rect y="552" width="800" height="48" fill="#060a14" opacity="0.5"/>
</svg>
