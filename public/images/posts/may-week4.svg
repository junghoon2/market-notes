<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="25%" stop-color="#1a1e4a"/>
      <stop offset="50%" stop-color="#3d2c5f"/>
      <stop offset="72%" stop-color="#9a5a4a"/>
      <stop offset="86%" stop-color="#d99a4a"/>
      <stop offset="100%" stop-color="#f6c97a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffd97a" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#e89048" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1e4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d99a4a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a1e4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peakLight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#1a1e4a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#5a3d62" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#c87a4a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd97a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="peakMid" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#0a0f24" stop-opacity="0.98"/>
      <stop offset="65%" stop-color="#2a2548" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7a4a52" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="water" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#9a5a4a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0f24" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="starblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g opacity="0.7">
    <circle cx="55" cy="40" r="0.9" fill="#ffffff"/>
    <circle cx="110" cy="75" r="0.7" fill="#ffffff"/>
    <circle cx="170" cy="50" r="1.0" fill="#ffffff"/>
    <circle cx="230" cy="90" r="0.7" fill="#ffffff"/>
    <circle cx="285" cy="55" r="0.9" fill="#ffffff"/>
    <circle cx="350" cy="100" r="0.7" fill="#ffffff"/>
    <circle cx="420" cy="45" r="0.8" fill="#ffffff"/>
    <circle cx="495" cy="85" r="0.7" fill="#ffffff"/>
    <circle cx="560" cy="40" r="1.0" fill="#ffffff"/>
    <circle cx="625" cy="70" r="0.7" fill="#ffffff"/>
    <circle cx="690" cy="50" r="0.9" fill="#ffffff"/>
    <circle cx="745" cy="80" r="0.8" fill="#ffffff"/>
    <circle cx="35" cy="135" r="0.7" fill="#ffffff"/>
    <circle cx="95" cy="170" r="0.9" fill="#ffffff"/>
    <circle cx="155" cy="145" r="0.7" fill="#ffffff"/>
    <circle cx="215" cy="180" r="0.8" fill="#ffffff"/>
    <circle cx="275" cy="155" r="0.7" fill="#ffffff"/>
    <circle cx="340" cy="190" r="0.7" fill="#ffffff"/>
    <circle cx="465" cy="170" r="0.8" fill="#ffffff"/>
    <circle cx="535" cy="195" r="0.7" fill="#ffffff"/>
    <circle cx="605" cy="155" r="0.9" fill="#ffffff"/>
    <circle cx="670" cy="185" r="0.7" fill="#ffffff"/>
    <circle cx="730" cy="160" r="0.8" fill="#ffffff"/>
  </g>

  <g opacity="0.4">
    <circle cx="80" cy="225" r="0.7" fill="#ffffff"/>
    <circle cx="160" cy="245" r="0.6" fill="#ffffff"/>
    <circle cx="280" cy="240" r="0.7" fill="#ffffff"/>
    <circle cx="380" cy="225" r="0.5" fill="#ffffff"/>
    <circle cx="510" cy="245" r="0.6" fill="#ffffff"/>
    <circle cx="640" cy="230" r="0.7" fill="#ffffff"/>
    <circle cx="710" cy="245" r="0.5" fill="#ffffff"/>
  </g>

  <g filter="url(#starblur)">
    <circle cx="170" cy="50" r="2.2" fill="#fff0c8"/>
    <circle cx="560" cy="40" r="2.4" fill="#fff0c8"/>
    <circle cx="95" cy="170" r="2.0" fill="#fff0c8"/>
    <circle cx="605" cy="155" r="2.2" fill="#fff0c8"/>
  </g>

  <g stroke="#fff0c8" stroke-width="0.5" opacity="0.55">
    <line x1="560" y1="26" x2="560" y2="54"/>
    <line x1="546" y1="40" x2="574" y2="40"/>
    <line x1="170" y1="36" x2="170" y2="64"/>
    <line x1="156" y1="50" x2="184" y2="50"/>
  </g>

  <ellipse cx="540" cy="370" rx="280" ry="180" fill="url(#halo)" opacity="0.85"/>
  <ellipse cx="540" cy="370" rx="140" ry="110" fill="url(#halo)" opacity="0.9"/>
  <circle cx="540" cy="370" r="62" fill="url(#sun)"/>
  <circle cx="540" cy="370" r="38" fill="#fff6d8" opacity="0.96" filter="url(#glow)"/>

  <g stroke="#ffe9b8" stroke-width="0.6" opacity="0.45">
    <line x1="540" y1="296" x2="540" y2="328"/>
    <line x1="540" y1="412" x2="540" y2="444"/>
    <line x1="466" y1="370" x2="498" y2="370"/>
    <line x1="582" y1="370" x2="614" y2="370"/>
  </g>

  <polygon points="-20,500 80,440 140,460 210,395 290,430 360,360 430,400 510,330 590,385 660,355 740,400 820,365 820,600 -20,600"
           fill="url(#peakMid)" opacity="0.95"/>

  <polygon points="380,420 430,400 510,330 590,385 660,355 740,400 820,365 820,500 380,500"
           fill="url(#peakLight)" opacity="0.85"/>

  <polygon points="-20,520 60,490 130,505 200,475 270,500 340,478 400,505 470,475 540,500 610,478 680,505 750,478 820,500 820,600 -20,600"
           fill="#050818" opacity="0.96"/>

  <rect x="0" y="500" width="800" height="100" fill="url(#water)" opacity="0.85"/>

  <ellipse cx="540" cy="510" rx="110" ry="12" fill="#ffe9b8" opacity="0.6" filter="url(#softblur)"/>
  <ellipse cx="540" cy="528" rx="80" ry="7" fill="#ffd97a" opacity="0.5" filter="url(#softblur)"/>
  <ellipse cx="540" cy="544" rx="55" ry="5" fill="#ffe9b8" opacity="0.38" filter="url(#softblur)"/>
  <ellipse cx="540" cy="560" rx="34" ry="3.5" fill="#ffd97a" opacity="0.28" filter="url(#softblur)"/>
  <ellipse cx="540" cy="574" rx="20" ry="2.5" fill="#ffe9b8" opacity="0.2" filter="url(#softblur)"/>

  <g stroke="#ffe9b8" stroke-width="0.5" opacity="0.35">
    <line x1="70"  y1="522" x2="150" y2="522"/>
    <line x1="220" y1="528" x2="300" y2="528"/>
    <line x1="380" y1="520" x2="450" y2="520"/>
    <line x1="660" y1="525" x2="730" y2="525"/>
    <line x1="50"  y1="552" x2="130" y2="552"/>
    <line x1="280" y1="556" x2="360" y2="556"/>
    <line x1="640" y1="554" x2="720" y2="554"/>
    <line x1="180" y1="578" x2="260" y2="578"/>
    <line x1="420" y1="582" x2="500" y2="582"/>
    <line x1="620" y1="585" x2="700" y2="585"/>
  </g>
</svg>
