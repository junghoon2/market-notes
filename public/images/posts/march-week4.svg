<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 반도체 칩 회로 패턴 -->
  <g stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.2">
    <!-- 중앙 칩 -->
    <rect x="280" y="180" width="240" height="240" rx="4" fill="url(#chip)" stroke-width="1.5"/>
    <!-- 핀 좌측 -->
    <line x1="220" y1="210" x2="280" y2="210"/><rect x="200" y="205" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="220" y1="240" x2="280" y2="240"/><rect x="200" y="235" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="220" y1="270" x2="280" y2="270"/><rect x="200" y="265" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="220" y1="300" x2="280" y2="300"/><rect x="200" y="295" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="220" y1="330" x2="280" y2="330"/><rect x="200" y="325" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="220" y1="360" x2="280" y2="360"/><rect x="200" y="355" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <!-- 핀 우측 -->
    <line x1="520" y1="210" x2="580" y2="210"/><rect x="580" y="205" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="520" y1="240" x2="580" y2="240"/><rect x="580" y="235" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="520" y1="270" x2="580" y2="270"/><rect x="580" y="265" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="520" y1="300" x2="580" y2="300"/><rect x="580" y="295" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="520" y1="330" x2="580" y2="330"/><rect x="580" y="325" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="520" y1="360" x2="580" y2="360"/><rect x="580" y="355" width="20" height="10" rx="2" fill="#60a5fa" opacity="0.3"/>
    <!-- 핀 상단 -->
    <line x1="320" y1="120" x2="320" y2="180"/><rect x="315" y="100" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="360" y1="120" x2="360" y2="180"/><rect x="355" y="100" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="400" y1="120" x2="400" y2="180"/><rect x="395" y="100" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="440" y1="120" x2="440" y2="180"/><rect x="435" y="100" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="480" y1="120" x2="480" y2="180"/><rect x="475" y="100" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <!-- 핀 하단 -->
    <line x1="320" y1="420" x2="320" y2="480"/><rect x="315" y="480" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="360" y1="420" x2="360" y2="480"/><rect x="355" y="480" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="400" y1="420" x2="400" y2="480"/><rect x="395" y="480" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="440" y1="420" x2="440" y2="480"/><rect x="435" y="480" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <line x1="480" y1="420" x2="480" y2="480"/><rect x="475" y="480" width="10" height="20" rx="2" fill="#60a5fa" opacity="0.3"/>
    <!-- 내부 코어 -->
    <rect x="330" y="230" width="140" height="140" rx="2" fill="#60a5fa" opacity="0.08"/>
    <rect x="350" y="250" width="100" height="100" rx="2" fill="#60a5fa" opacity="0.06"/>
  </g>

  <!-- 하락 차트 오버레이 -->
  <polyline
    points="60,140 160,145 260,150 350,155 420,200 480,260 530,300 570,310 620,305 680,300 750,295 800,290"
    fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.7"
  />

  <!-- 추가매수 포인트 -->
  <circle cx="480" cy="260" r="6" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
  <circle cx="530" cy="300" r="6" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
  <text x="490" y="255" font-family="Arial, sans-serif" font-size="10" fill="#fbbf24" opacity="0.8" letter-spacing="1">매수</text>

  <!-- 배경 텍스트 -->
  <text x="40" y="560" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#3b82f6" opacity="0.08">반도체</text>
</svg>
