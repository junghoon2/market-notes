<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 폭풍의 밤: 짙은 슬레이트 → 차가운 남색 → 골짜기 바닥의 어둠 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="35%" style="stop-color:#111a2e"/>
      <stop offset="70%" style="stop-color:#152238"/>
      <stop offset="100%" style="stop-color:#060a13"/>
    </linearGradient>
    <!-- 한 줄기 안정광 (TSMC): 차가운 청록 후광 -->
    <radialGradient id="beam" cx="72%" cy="34%" r="34%">
      <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:0.55"/>
      <stop offset="45%" style="stop-color:#38bdf8;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="trough" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.5"/>
      <stop offset="55%" style="stop-color:#0f172a;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#020509;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0a1220"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#111a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 안정광 후광 -->
  <ellipse cx="576" cy="204" rx="300" ry="230" fill="url(#beam)" filter="url(#glow)"/>

  <!-- 흐린 별 (폭풍 사이로 드문드문) -->
  <g fill="white">
    <circle cx="60" cy="44" r="0.9" opacity="0.45"/>
    <circle cx="140" cy="28" r="0.7" opacity="0.35"/>
    <circle cx="230" cy="60" r="1.0" opacity="0.5"/>
    <circle cx="315" cy="36" r="0.7" opacity="0.35"/>
    <circle cx="400" cy="54" r="0.8" opacity="0.4"/>
    <circle cx="120" cy="110" r="0.8" opacity="0.35"/>
    <circle cx="250" cy="130" r="0.7" opacity="0.3"/>
    <circle cx="330" cy="150" r="0.9" opacity="0.35"/>
    <circle cx="70" cy="175" r="0.7" opacity="0.3"/>
    <circle cx="190" cy="195" r="0.8" opacity="0.3"/>
  </g>

  <!-- 안정광 중심의 밝은 별 -->
  <g fill="white" filter="url(#starblur)">
    <circle cx="576" cy="196" r="3.0" opacity="0.95"/>
    <circle cx="646" cy="150" r="1.8" opacity="0.7"/>
    <circle cx="512" cy="140" r="1.6" opacity="0.6"/>
  </g>
  <!-- 십자형 별빛 (안정광) -->
  <g stroke="#e0f2fe" stroke-width="0.7" opacity="0.6">
    <line x1="576" y1="184" x2="576" y2="208"/>
    <line x1="564" y1="196" x2="588" y2="196"/>
  </g>

  <!-- 번개 (급락 메타포) -->
  <g stroke="#93c5fd" stroke-width="1.6" fill="none" opacity="0.5" filter="url(#softglow)">
    <polyline points="196,40 182,150 214,168 190,300"/>
  </g>
  <g stroke="#dbeafe" stroke-width="0.9" fill="none" opacity="0.7">
    <polyline points="196,40 182,150 214,168 190,300"/>
  </g>

  <!-- 무거운 폭풍 구름대 -->
  <g>
    <ellipse cx="210" cy="150" rx="180" ry="34" fill="#0f172a" opacity="0.7"/>
    <ellipse cx="120" cy="185" rx="150" ry="26" fill="#1e293b" opacity="0.55"/>
    <ellipse cx="430" cy="200" rx="200" ry="30" fill="#0f172a" opacity="0.5"/>
    <ellipse cx="640" cy="300" rx="180" ry="24" fill="#152238" opacity="0.45"/>
  </g>

  <!-- 깊은 골(하락) 영역 -->
  <path d="M0,360 C160,330 300,470 400,500 C520,536 640,430 800,470 L800,600 L0,600 Z" fill="url(#trough)"/>

  <!-- 거친 파도: 원경 -->
  <path d="M0,470 C90,440 150,470 240,452 C330,434 400,480 490,458 C580,436 660,472 750,452 L800,462 L800,600 L0,600 Z" fill="url(#wave2)" opacity="0.7"/>

  <!-- 거친 파도: 전경 -->
  <path d="M0,520 C80,492 150,522 235,500 C330,476 400,528 495,504 C590,480 665,524 755,500 L800,510 L800,600 L0,600 Z" fill="url(#wave1)"/>

  <!-- 파도 마루 흰 포말 -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.25" fill="none">
    <path d="M120,510 C150,500 175,506 205,500"/>
    <path d="M360,516 C395,504 425,510 460,502"/>
    <path d="M600,512 C640,500 675,508 715,500"/>
  </g>

  <!-- 안정광 수면 반사 -->
  <ellipse cx="576" cy="522" rx="150" ry="10" fill="#38bdf8" opacity="0.16"/>
  <ellipse cx="576" cy="544" rx="100" ry="6" fill="#7dd3fc" opacity="0.1"/>
  <ellipse cx="576" cy="562" rx="60" ry="4" fill="#38bdf8" opacity="0.08"/>
</svg>
