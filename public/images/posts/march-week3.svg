<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#022c22"/>
      <stop offset="50%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="areafill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 그리드 -->
  <g opacity="0.07" stroke="#fff" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- 차트 영역 채우기 -->
  <polygon
    points="60,500 120,480 180,460 240,440 290,430 330,410 360,350 400,280 450,210 500,190 550,170 600,155 650,140 710,125 760,115 800,108 800,600 60,600"
    fill="url(#areafill)"
  />

  <!-- 회복 상승 차트 라인 -->
  <polyline
    points="60,500 120,480 180,460 240,440 290,430 330,410 360,350 400,280 450,210 500,190 550,170 600,155 650,140 710,125 760,115 800,108"
    fill="none" stroke="#34d399" stroke-width="3" opacity="1"
  />

  <!-- +53.5% 텍스트 -->
  <text x="50" y="300" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#34d399" opacity="0.18">+53.5%</text>

  <!-- 전고점 기준선 -->
  <line x1="0" y1="115" x2="800" y2="115" stroke="#34d399" stroke-width="1" opacity="0.5" stroke-dasharray="8,4"/>
  <text x="620" y="108" font-family="Arial, sans-serif" font-size="11" fill="#34d399" opacity="0.8" letter-spacing="2">전고점</text>

  <!-- 데이터 포인트 -->
  <circle cx="760" cy="115" r="5" fill="#34d399" opacity="0.9"/>
  <circle cx="500" cy="190" r="4" fill="#34d399" opacity="0.6"/>
  <circle cx="360" cy="350" r="4" fill="#34d399" opacity="0.6"/>

  <!-- 하단 장식 -->
  <rect x="0" y="590" width="800" height="10" fill="#34d399" opacity="0.2"/>
</svg>
