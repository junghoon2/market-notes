<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="35%" style="stop-color:#4c1d95"/>
      <stop offset="65%" style="stop-color:#be185d"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="moon" cx="72%" cy="28%" r="8%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="60%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 새벽 하늘 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 달 글로우 -->
  <circle cx="576" cy="168" r="80" fill="#fde68a" opacity="0.12" filter="url(#glow)"/>

  <!-- 달 -->
  <circle cx="576" cy="168" r="32" fill="#fef9c3" opacity="0.95"/>
  <!-- 달 크레이터 느낌 -->
  <circle cx="566" cy="158" r="6" fill="#fde68a" opacity="0.4"/>
  <circle cx="583" cy="173" r="4" fill="#fde68a" opacity="0.3"/>
  <circle cx="570" cy="178" r="3" fill="#fde68a" opacity="0.25"/>

  <!-- 별 -->
  <g fill="white">
    <circle cx="60" cy="40" r="1.0" opacity="0.8"/>
    <circle cx="130" cy="70" r="0.8" opacity="0.6"/>
    <circle cx="210" cy="30" r="1.2" opacity="0.85"/>
    <circle cx="290" cy="55" r="0.9" opacity="0.7"/>
    <circle cx="360" cy="20" r="0.7" opacity="0.55"/>
    <circle cx="440" cy="65" r="1.1" opacity="0.8"/>
    <circle cx="500" cy="35" r="0.8" opacity="0.6"/>
    <circle cx="660" cy="45" r="0.9" opacity="0.7"/>
    <circle cx="720" cy="80" r="1.0" opacity="0.75"/>
    <circle cx="780" cy="30" r="0.8" opacity="0.65"/>
    <circle cx="90" cy="120" r="0.7" opacity="0.5"/>
    <circle cx="170" cy="100" r="1.0" opacity="0.75"/>
    <circle cx="350" cy="110" r="0.8" opacity="0.6"/>
    <circle cx="470" cy="95" r="0.9" opacity="0.7"/>
    <circle cx="640" cy="115" r="0.7" opacity="0.55"/>
    <circle cx="750" cy="130" r="1.1" opacity="0.8"/>
  </g>

  <!-- 구름 (새벽빛 물든) -->
  <g opacity="0.3" filter="url(#softblur)">
    <ellipse cx="150" cy="200" rx="140" ry="35" fill="#f9a8d4"/>
    <ellipse cx="110" cy="210" rx="80" ry="28" fill="#f9a8d4"/>
    <ellipse cx="200" cy="205" rx="90" ry="26" fill="#f9a8d4"/>
    <ellipse cx="550" cy="240" rx="120" ry="30" fill="#fdba74"/>
    <ellipse cx="680" cy="220" rx="100" ry="28" fill="#fdba74"/>
  </g>

  <!-- 지평선 -->
  <rect x="0" y="370" width="800" height="2" fill="#f472b6" opacity="0.4"/>

  <!-- 물 반사 -->
  <rect x="0" y="372" width="800" height="228" fill="url(#water)"/>

  <!-- 달 물 반사 -->
  <ellipse cx="576" cy="440" rx="55" ry="12" fill="#fef9c3" opacity="0.25"/>
  <ellipse cx="576" cy="470" rx="38" ry="8" fill="#fef9c3" opacity="0.15"/>
  <ellipse cx="576" cy="496" rx="24" ry="5" fill="#fef9c3" opacity="0.1"/>

  <!-- 물결 -->
  <g stroke="#be185d" stroke-width="1" fill="none" opacity="0.25">
    <path d="M0,410 Q100,404 200,410 Q300,416 400,410 Q500,404 600,410 Q700,416 800,410"/>
    <path d="M0,440 Q150,434 300,440 Q450,446 600,440 Q700,436 800,440"/>
    <path d="M0,470 Q100,464 200,470 Q400,476 600,470 Q700,466 800,470"/>
    <path d="M0,500 Q200,494 400,500 Q600,506 800,500"/>
    <path d="M0,530 Q150,524 300,530 Q500,536 800,530"/>
  </g>

  <!-- 전경 나무 실루엣 (벚꽃나무 느낌) -->
  <g fill="#1e1b4b">
    <!-- 나무 줄기 -->
    <rect x="68" y="310" width="8" height="62" rx="2"/>
    <rect x="716" y="315" width="8" height="57" rx="2"/>
    <rect x="30" y="330" width="6" height="42" rx="2"/>
    <rect x="755" y="335" width="6" height="37" rx="2"/>
  </g>
  <!-- 나뭇가지 -->
  <g stroke="#1e1b4b" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M72,315 Q60,300 45,288 M72,315 Q80,298 95,286 M72,315 Q72,295 72,280"/>
    <path d="M720,320 Q708,305 693,293 M720,320 Q728,303 743,291 M720,320 Q720,300 720,285"/>
  </g>

  <!-- 벚꽃 (분홍 점들) -->
  <g fill="#f9a8d4" opacity="0.7">
    <circle cx="45" cy="285" r="7"/>
    <circle cx="60" cy="278" r="5"/>
    <circle cx="72" cy="272" r="8"/>
    <circle cx="86" cy="280" r="6"/>
    <circle cx="98" cy="274" r="7"/>
    <circle cx="52" cy="296" r="5"/>
    <circle cx="80" cy="292" r="6"/>
    <circle cx="693" cy="290" r="7"/>
    <circle cx="708" cy="282" r="5"/>
    <circle cx="720" cy="277" r="8"/>
    <circle cx="734" cy="285" r="6"/>
    <circle cx="746" cy="279" r="7"/>
    <circle cx="700" cy="298" r="5"/>
    <circle cx="728" cy="295" r="6"/>
  </g>
  <!-- 떨어지는 벚꽃잎 -->
  <g fill="#f9a8d4" opacity="0.5">
    <ellipse cx="150" cy="320" rx="3" ry="2" transform="rotate(-20 150 320)"/>
    <ellipse cx="220" cy="340" rx="3" ry="2" transform="rotate(15 220 340)"/>
    <ellipse cx="310" cy="310" rx="3" ry="2" transform="rotate(-35 310 310)"/>
    <ellipse cx="480" cy="325" rx="3" ry="2" transform="rotate(25 480 325)"/>
    <ellipse cx="580" cy="315" rx="3" ry="2" transform="rotate(-10 580 315)"/>
    <ellipse cx="650" cy="335" rx="3" ry="2" transform="rotate(40 650 335)"/>
  </g>
</svg>
