<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0420"/>
      <stop offset="35%" stop-color="#2b0a4a"/>
      <stop offset="65%" stop-color="#6b1556"/>
      <stop offset="85%" stop-color="#d24a2a"/>
      <stop offset="100%" stop-color="#f6c14d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffe9a5" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffae3d" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#e84c2a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b0a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd66b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff7a2a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b0a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fcd06a" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#9b3052" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0420" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="starblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g opacity="0.85">
    <circle cx="60" cy="40" r="0.9" fill="#ffffff"/>
    <circle cx="120" cy="80" r="1.3" fill="#ffffff"/>
    <circle cx="180" cy="55" r="0.8" fill="#ffffff"/>
    <circle cx="240" cy="95" r="1.1" fill="#ffffff"/>
    <circle cx="290" cy="40" r="0.7" fill="#ffffff"/>
    <circle cx="350" cy="90" r="1.4" fill="#ffffff"/>
    <circle cx="430" cy="50" r="0.9" fill="#ffffff"/>
    <circle cx="500" cy="80" r="1.2" fill="#ffffff"/>
    <circle cx="570" cy="35" r="0.8" fill="#ffffff"/>
    <circle cx="640" cy="70" r="1.0" fill="#ffffff"/>
    <circle cx="700" cy="45" r="0.7" fill="#ffffff"/>
    <circle cx="760" cy="85" r="1.3" fill="#ffffff"/>
    <circle cx="40" cy="120" r="1.0" fill="#ffffff"/>
    <circle cx="90" cy="170" r="0.7" fill="#ffffff"/>
    <circle cx="150" cy="140" r="1.2" fill="#ffffff"/>
    <circle cx="210" cy="180" r="0.8" fill="#ffffff"/>
    <circle cx="270" cy="160" r="1.1" fill="#ffffff"/>
    <circle cx="330" cy="200" r="0.7" fill="#ffffff"/>
    <circle cx="470" cy="170" r="1.0" fill="#ffffff"/>
    <circle cx="540" cy="200" r="0.8" fill="#ffffff"/>
    <circle cx="610" cy="150" r="1.3" fill="#ffffff"/>
    <circle cx="680" cy="190" r="0.9" fill="#ffffff"/>
    <circle cx="750" cy="160" r="1.0" fill="#ffffff"/>
    <circle cx="80" cy="230" r="0.8" fill="#ffffff"/>
    <circle cx="160" cy="260" r="0.7" fill="#ffffff"/>
    <circle cx="280" cy="240" r="1.0" fill="#ffffff"/>
    <circle cx="520" cy="250" r="0.9" fill="#ffffff"/>
    <circle cx="640" cy="270" r="0.8" fill="#ffffff"/>
    <circle cx="730" cy="240" r="1.1" fill="#ffffff"/>
  </g>

  <g filter="url(#starblur)">
    <circle cx="120" cy="80" r="2.6" fill="#fff5d8"/>
    <circle cx="350" cy="90" r="2.8" fill="#fff5d8"/>
    <circle cx="500" cy="80" r="2.6" fill="#fff5d8"/>
    <circle cx="640" cy="70" r="2.4" fill="#fff5d8"/>
    <circle cx="610" cy="150" r="2.6" fill="#fff5d8"/>
  </g>

  <g stroke="#fff5d8" stroke-width="0.6" opacity="0.7">
    <line x1="350" y1="74" x2="350" y2="106"/>
    <line x1="334" y1="90" x2="366" y2="90"/>
    <line x1="500" y1="66" x2="500" y2="94"/>
    <line x1="486" y1="80" x2="514" y2="80"/>
  </g>

  <g opacity="0.55">
    <line x1="400" y1="380" x2="200" y2="60" stroke="#ffe6a8" stroke-width="2" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="320" y2="40" stroke="#ffe6a8" stroke-width="1.5" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="430" y2="20" stroke="#ffd380" stroke-width="2.5" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="540" y2="40" stroke="#ffd380" stroke-width="1.5" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="660" y2="80" stroke="#ffe6a8" stroke-width="1.8" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="780" y2="200" stroke="#ffd380" stroke-width="1.4" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="20" y2="200" stroke="#ffd380" stroke-width="1.4" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="120" y2="260" stroke="#ffe6a8" stroke-width="1.2" filter="url(#softblur)"/>
    <line x1="400" y1="380" x2="700" y2="280" stroke="#ffe6a8" stroke-width="1.2" filter="url(#softblur)"/>
  </g>

  <ellipse cx="400" cy="380" rx="380" ry="220" fill="url(#halo)"/>
  <ellipse cx="400" cy="380" rx="180" ry="160" fill="url(#halo)" opacity="0.85"/>
  <circle cx="400" cy="380" r="120" fill="url(#sun)"/>
  <circle cx="400" cy="380" r="44" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>

  <g opacity="0.7" fill="#ffe6a8">
    <circle cx="180" cy="320" r="1.4" filter="url(#starblur)"/>
    <circle cx="240" cy="240" r="1.2" filter="url(#starblur)"/>
    <circle cx="560" cy="240" r="1.5" filter="url(#starblur)"/>
    <circle cx="620" cy="320" r="1.3" filter="url(#starblur)"/>
    <circle cx="300" cy="200" r="1.0" filter="url(#starblur)"/>
    <circle cx="500" cy="200" r="1.0" filter="url(#starblur)"/>
  </g>

  <polygon points="0,460 90,420 170,440 250,400 330,430 410,395 490,425 560,405 640,435 720,410 800,440 800,600 0,600"
           fill="#1a0827" opacity="0.92"/>
  <polygon points="0,490 80,460 150,475 230,455 310,475 390,450 470,475 550,460 630,478 710,460 800,478 800,600 0,600"
           fill="#0d0418" opacity="0.95"/>

  <rect x="0" y="478" width="800" height="122" fill="url(#water)" opacity="0.85"/>
  <ellipse cx="400" cy="492" rx="120" ry="16" fill="#ffd380" opacity="0.55" filter="url(#softblur)"/>
  <ellipse cx="400" cy="510" rx="80" ry="9" fill="#ffe6a8" opacity="0.45" filter="url(#softblur)"/>
  <ellipse cx="400" cy="528" rx="50" ry="5" fill="#ffd380" opacity="0.35" filter="url(#softblur)"/>

  <g stroke="#ffe6a8" stroke-width="0.5" opacity="0.45">
    <line x1="120" y1="500" x2="200" y2="500"/>
    <line x1="600" y1="510" x2="680" y2="510"/>
    <line x1="80"  y1="540" x2="160" y2="540"/>
    <line x1="640" y1="546" x2="720" y2="546"/>
    <line x1="240" y1="556" x2="320" y2="556"/>
    <line x1="480" y1="556" x2="560" y2="556"/>
    <line x1="160" y1="572" x2="220" y2="572"/>
    <line x1="580" y1="578" x2="640" y2="578"/>
  </g>
</svg>
