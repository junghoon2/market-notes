<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="30%" style="stop-color:#4c1d95"/>
      <stop offset="55%" style="stop-color:#c2410c"/>
      <stop offset="75%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="78%" r="30%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#fef3c7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.7"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#92400e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 태양 후광 -->
  <ellipse cx="400" cy="460" rx="350" ry="200" fill="url(#sun)" filter="url(#glow)"/>
  <ellipse cx="400" cy="460" rx="200" ry="120" fill="#fef3c7" opacity="0.15" filter="url(#glow)"/>

  <!-- 별 (상단 어두운 영역) -->
  <g fill="white">
    <circle cx="60" cy="35" r="1.0" opacity="0.7"/>
    <circle cx="130" cy="18" r="0.8" opacity="0.6"/>
    <circle cx="210" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="290" cy="25" r="0.7" opacity="0.5"/>
    <circle cx="370" cy="42" r="0.9" opacity="0.6"/>
    <circle cx="450" cy="20" r="1.1" opacity="0.7"/>
    <circle cx="530" cy="55" r="0.8" opacity="0.5"/>
    <circle cx="610" cy="30" r="1.3" opacity="0.8"/>
    <circle cx="690" cy="48" r="0.9" opacity="0.6"/>
    <circle cx="760" cy="22" r="1.0" opacity="0.7"/>
    <circle cx="95" cy="80" r="0.7" opacity="0.5"/>
    <circle cx="180" cy="95" r="1.0" opacity="0.6"/>
    <circle cx="340" cy="85" r="0.8" opacity="0.4"/>
    <circle cx="500" cy="90" r="0.9" opacity="0.5"/>
    <circle cx="650" cy="78" r="1.1" opacity="0.6"/>
    <circle cx="740" cy="95" r="0.7" opacity="0.4"/>
  </g>

  <!-- 밝은 별 -->
  <g fill="white" filter="url(#starblur)">
    <circle cx="210" cy="50" r="2.2" opacity="0.9"/>
    <circle cx="610" cy="30" r="2.5" opacity="0.9"/>
    <circle cx="450" cy="20" r="2.0" opacity="0.8"/>
  </g>

  <!-- 십자형 별빛 -->
  <g stroke="white" stroke-width="0.6" opacity="0.5">
    <line x1="610" y1="23" x2="610" y2="37"/>
    <line x1="603" y1="30" x2="617" y2="30"/>
  </g>

  <!-- 구름 (빛을 받는) -->
  <g opacity="0.5">
    <ellipse cx="200" cy="180" rx="120" ry="25" fill="#c084fc" opacity="0.4"/>
    <ellipse cx="600" cy="160" rx="130" ry="22" fill="#c084fc" opacity="0.35"/>
    <ellipse cx="150" cy="250" rx="100" ry="20" fill="#f97316" opacity="0.3"/>
    <ellipse cx="650" cy="240" rx="110" ry="18" fill="#f97316" opacity="0.3"/>
    <ellipse cx="350" cy="300" rx="140" ry="15" fill="#fbbf24" opacity="0.25"/>
  </g>

  <!-- 원경 산 -->
  <polygon points="0,420 80,360 160,390 250,340 350,370 450,320 550,350 650,310 750,340 800,360 800,480 0,480" fill="url(#mountain2)" opacity="0.7"/>

  <!-- 전경 산 -->
  <polygon points="0,480 60,430 140,460 230,400 320,440 400,390 480,420 560,380 650,410 730,370 800,400 800,600 0,600" fill="url(#mountain1)"/>

  <!-- 산 위 설산 빛 반사 -->
  <polygon points="230,400 255,370 280,400" fill="#fbbf24" opacity="0.15"/>
  <polygon points="400,390 425,358 450,390" fill="#fbbf24" opacity="0.2"/>
  <polygon points="560,380 585,350 610,380" fill="#fbbf24" opacity="0.15"/>
  <polygon points="730,370 755,342 780,370" fill="#fbbf24" opacity="0.18"/>

  <!-- 태양 (지평선에서 떠오르는) -->
  <ellipse cx="400" cy="400" rx="50" ry="50" fill="url(#suncore)"/>
  <ellipse cx="400" cy="400" rx="65" ry="65" fill="#fbbf24" opacity="0.3" filter="url(#softglow)"/>

  <!-- 수평선 위 빛줄기 -->
  <g stroke="#fef3c7" stroke-width="1" opacity="0.15">
    <line x1="400" y1="400" x2="100" y2="320"/>
    <line x1="400" y1="400" x2="200" y2="300"/>
    <line x1="400" y1="400" x2="300" y2="290"/>
    <line x1="400" y1="400" x2="500" y2="290"/>
    <line x1="400" y1="400" x2="600" y2="300"/>
    <line x1="400" y1="400" x2="700" y2="320"/>
  </g>

  <!-- 물 반사 -->
  <rect x="0" y="480" width="800" height="120" fill="url(#water)"/>
  <ellipse cx="400" cy="510" rx="200" ry="15" fill="#fbbf24" opacity="0.25"/>
  <ellipse cx="400" cy="530" rx="140" ry="8" fill="#fef3c7" opacity="0.15"/>
  <ellipse cx="400" cy="550" rx="80" ry="5" fill="#fbbf24" opacity="0.1"/>

  <!-- 전경 나무 실루엣 -->
  <g fill="#0f172a">
    <polygon points="20,600 35,520 50,600"/>
    <polygon points="50,600 68,510 86,600"/>
    <polygon points="710,600 728,515 746,600"/>
    <polygon points="745,600 762,505 779,600"/>
    <polygon points="775,600 790,525 805,600"/>
  </g>
</svg>
