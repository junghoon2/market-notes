<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a2e"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <radialGradient id="galaxy" cx="55%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.3"/>
      <stop offset="60%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula" cx="30%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:0"/>
    </radialGradient>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 은하 구름 -->
