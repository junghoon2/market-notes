<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="50%" style="stop-color:#bbf7d0"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="mist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:0"/>
    </linearGradient>
    <filter id="mistblur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 하늘 구름 -->
  <g fill="white" opacity="0.7">
    <ellipse cx="150" cy="80" rx="120" ry="35"/>
    <ellipse cx="120" cy="88" rx="70" ry="28"/>
    <ellipse cx="200" cy="85" rx="80" ry="26"/>
    <ellipse cx="600" cy="60" rx="150" ry="38"/>
    <ellipse cx="560" cy="70" rx="80" ry="30"/>
    <ellipse cx="660" cy="68" rx="90" ry="28"/>
    <ellipse cx="380" cy="100" rx="90" ry="25"/>
  </g>

  <!-- 원경 산 (옅은) -->
  <polygon points="0,340 100,240 200,280 300,200 400,260 500,190 600,250 700,200 800,240 800,400 0,400" fill="#86efac" opacity="0.5"/>

  <!-- 중경 산 -->
  <polygon points="0,600 0,360 120,280 220,330 320,250 420,310 500,240 580,290 660,230 760,280 800,250 800,600" fill="url(#mountain1)"/>

  <!-- 전경 산 -->
  <polygon points="0,600 0,420 80,380 160,410 260,350 340,390 420,330 500,370 580,320 680,360 760,330 800,360 800,600" fill="url(#mountain2)"/>

  <!-- 설산 정상 눈 -->
  <polygon points="260,350 290,310 320,350" fill="url(#snow)" opacity="0.9"/>
  <polygon points="400,330 430,288 460,330" fill="url(#snow)" opacity="0.9"/>
  <polygon points="550,320 580,275 610,320" fill="url(#snow)" opacity="0.9"/>
  <polygon points="720,330 750,292 780,330" fill="url(#snow)" opacity="0.9"/>

  <!-- 계곡 안개 -->
  <rect x="0" y="400" width="800" height="100" fill="url(#mist)" filter="url(#mistblur)"/>
  <rect x="0" y="440" width="800" height="80" fill="#d1fae5" opacity="0.3" filter="url(#mistblur)"/>

  <!-- 전경 나무 실루엣 -->
  <g fill="#14532d">
    <polygon points="30,600 45,520 60,600"/>
    <polygon points="60,600 78,510 96,600"/>
    <polygon points="700,600 718,515 736,600"/>
    <polygon points="735,600 752,505 769,600"/>
    <polygon points="760,600 778,518 796,600"/>
    <polygon points="10,600 25,530 40,600"/>
  </g>

  <!-- 강 반사 -->
  <ellipse cx="400" cy="520" rx="180" ry="30" fill="#86efac" opacity="0.4"/>
  <ellipse cx="400" cy="535" rx="120" ry="18" fill="#4ade80" opacity="0.2"/>
</svg>
