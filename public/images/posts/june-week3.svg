<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 새벽을 뚫고 오르는 돌파의 하늘: 짙은 청 → 청록 → 금빛 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120"/>
      <stop offset="32%" style="stop-color:#0e2a47"/>
      <stop offset="58%" style="stop-color:#0e7490"/>
      <stop offset="80%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="78%" r="36%">
      <stop offset="0%" style="stop-color:#fef9c3;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#fbbf24;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#fef9c3;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.55"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="beamcyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#67e8f9;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#0e7490;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:0.55"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2a47"/>
      <stop offset="100%" style="stop-color:#070d18"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#155e75"/>
      <stop offset="100%" style="stop-color:#0e2a47"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="beamblur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 정점 후광 -->
  <ellipse cx="400" cy="430" rx="380" ry="220" fill="url(#halo)" filter="url(#glow)"/>
  <ellipse cx="400" cy="430" rx="200" ry="120" fill="#fef9c3" opacity="0.15" filter="url(#glow)"/>

  <!-- 별 (상단 어두운 영역) -->
  <g fill="white">
    <circle cx="48" cy="34" r="1.0" opacity="0.7"/>
    <circle cx="120" cy="22" r="0.8" opacity="0.6"/>
    <circle cx="198" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="278" cy="26" r="0.7" opacity="0.5"/>
    <circle cx="360" cy="42" r="0.9" opacity="0.6"/>
    <circle cx="442" cy="20" r="1.1" opacity="0.7"/>
    <circle cx="520" cy="54" r="0.8" opacity="0.5"/>
    <circle cx="600" cy="30" r="1.3" opacity="0.8"/>
    <circle cx="680" cy="48" r="0.9" opacity="0.6"/>
    <circle cx="752" cy="22" r="1.0" opacity="0.7"/>
    <circle cx="84" cy="82" r="0.7" opacity="0.5"/>
    <circle cx="170" cy="96" r="1.0" opacity="0.6"/>
    <circle cx="330" cy="86" r="0.8" opacity="0.4"/>
    <circle cx="490" cy="90" r="0.9" opacity="0.5"/>
    <circle cx="640" cy="78" r="1.1" opacity="0.6"/>
    <circle cx="730" cy="96" r="0.7" opacity="0.4"/>
    <circle cx="262" cy="118" r="0.8" opacity="0.4"/>
    <circle cx="556" cy="126" r="0.9" opacity="0.45"/>
  </g>

  <!-- 밝은 별 -->
  <g fill="white" filter="url(#starblur)">
    <circle cx="198" cy="50" r="2.2" opacity="0.9"/>
    <circle cx="600" cy="30" r="2.5" opacity="0.9"/>
    <circle cx="442" cy="20" r="2.0" opacity="0.8"/>
  </g>

  <!-- 십자형 별빛 -->
  <g stroke="white" stroke-width="0.6" opacity="0.5">
    <line x1="600" y1="23" x2="600" y2="37"/>
    <line x1="593" y1="30" x2="607" y2="30"/>
  </g>

  <!-- 빛을 받는 구름 띠 -->
  <g opacity="0.5">
    <ellipse cx="185" cy="180" rx="120" ry="22" fill="#0891b2" opacity="0.4"/>
    <ellipse cx="615" cy="160" rx="130" ry="20" fill="#0891b2" opacity="0.35"/>
    <ellipse cx="150" cy="250" rx="100" ry="18" fill="#f97316" opacity="0.28"/>
    <ellipse cx="650" cy="240" rx="110" ry="16" fill="#f97316" opacity="0.28"/>
    <ellipse cx="350" cy="300" rx="150" ry="13" fill="#fbbf24" opacity="0.2"/>
  </g>

  <!-- 동반 상승: 정점에서 동시에 솟구치는 여러 빛기둥 (메모리 3대장) -->
  <polygon points="300,430 360,430 320,40 280,40" fill="url(#beamcyan)" opacity="0.6" filter="url(#beamblur)"/>
  <polygon points="440,430 500,430 520,40 480,40" fill="url(#beamcyan)" opacity="0.6" filter="url(#beamblur)"/>
  <polygon points="368,430 432,430 470,24 330,24" fill="url(#beam)" opacity="0.78" filter="url(#beamblur)"/>
  <polygon points="388,430 412,430 424,60 376,60" fill="#fffbeb" opacity="0.4" filter="url(#beamblur)"/>

  <!-- 원경 능선 -->
  <polygon points="0,420 80,360 160,390 250,335 350,370 450,318 550,350 650,305 750,338 800,358 800,470 0,470" fill="url(#mountain2)" opacity="0.7"/>

  <!-- 전경 정상: 가운데 봉우리가 빛의 띠를 뚫고 가장 높이 솟는다 -->
  <polygon points="0,480 70,438 150,462 240,408 320,440 400,360 480,420 560,388 650,414 730,378 800,404 800,600 0,600" fill="url(#mountain1)"/>

  <!-- 정상에 닿는 빛 반사 -->
  <polygon points="320,440 345,408 370,440" fill="#fbbf24" opacity="0.18"/>
  <polygon points="400,360 426,322 452,360" fill="#fde68a" opacity="0.3"/>
  <polygon points="560,388 585,356 610,388" fill="#fbbf24" opacity="0.16"/>
  <polygon points="730,378 755,348 780,378" fill="#fbbf24" opacity="0.18"/>

  <!-- 정상을 막 넘는 태양 -->
  <ellipse cx="400" cy="362" rx="50" ry="50" fill="url(#suncore)"/>
  <ellipse cx="400" cy="362" rx="66" ry="66" fill="#fbbf24" opacity="0.32" filter="url(#softglow)"/>

  <!-- 정점에서 퍼지는 빛줄기 -->
  <g stroke="#fef9c3" stroke-width="1" opacity="0.16">
    <line x1="400" y1="362" x2="100" y2="290"/>
    <line x1="400" y1="362" x2="220" y2="275"/>
    <line x1="400" y1="362" x2="320" y2="262"/>
    <line x1="400" y1="362" x2="480" y2="262"/>
    <line x1="400" y1="362" x2="580" y2="275"/>
    <line x1="400" y1="362" x2="700" y2="290"/>
  </g>

  <!-- 물 반사 -->
  <rect x="0" y="470" width="800" height="130" fill="url(#water)"/>
  <ellipse cx="400" cy="500" rx="210" ry="15" fill="#fbbf24" opacity="0.25"/>
  <ellipse cx="400" cy="524" rx="150" ry="8" fill="#fef9c3" opacity="0.15"/>
  <ellipse cx="400" cy="546" rx="85" ry="5" fill="#fbbf24" opacity="0.1"/>

  <!-- 전경 나무 실루엣 -->
  <g fill="#070d18">
    <polygon points="16,600 31,522 46,600"/>
    <polygon points="46,600 64,510 82,600"/>
    <polygon points="714,600 732,515 750,600"/>
    <polygon points="749,600 766,505 783,600"/>
    <polygon points="779,600 794,525 809,600"/>
  </g>
</svg>
