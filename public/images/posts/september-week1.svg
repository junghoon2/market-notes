<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 새벽 직전. 아직 어둡지만 한쪽만 밝아온다 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="28%" stop-color="#0b1424"/>
      <stop offset="54%" stop-color="#152437"/>
      <stop offset="76%" stop-color="#22384b"/>
      <stop offset="92%" stop-color="#38566a"/>
      <stop offset="100%" stop-color="#5a7f8c"/>
    </linearGradient>
    <!-- 오른쪽 수평선에서 올라오는 여명 (미장 반등) -->
    <radialGradient id="dawn" cx="76%" cy="98%" r="62%">
      <stop offset="0%" stop-color="#f2d9a8" stop-opacity="0.62"/>
      <stop offset="22%" stop-color="#d9a273" stop-opacity="0.34"/>
      <stop offset="52%" stop-color="#7d7ea0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#152437" stop-opacity="0"/>
    </radialGradient>
    <!-- 왼쪽에 남은 정체된 냉기 (국장) -->
    <radialGradient id="cold" cx="16%" cy="92%" r="52%">
      <stop offset="0%" stop-color="#43607a" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1b2c40" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5c6c"/>
      <stop offset="34%" stop-color="#1c2f42"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="62%" stop-color="#101c2c"/>
      <stop offset="100%" stop-color="#1a2c3c"/>
    </linearGradient>
    <!-- 잔잔한 안개층. 심심한 장 -->
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d97a8" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#b6c9d2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e0c9a4" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="starblur" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#cold)"/>
  <rect width="800" height="600" fill="url(#dawn)"/>

  <!-- 별. 왼쪽 위로 갈수록 많고 오른쪽 아래는 여명에 지워진다 -->
  <g fill="#e8f0f6">
    <circle cx="42" cy="38" r="1.5" opacity="0.85"/><circle cx="96" cy="72" r="1" opacity="0.55"/>
    <circle cx="150" cy="30" r="1.2" opacity="0.7"/><circle cx="186" cy="104" r="0.9" opacity="0.45"/>
    <circle cx="228" cy="52" r="1.6" opacity="0.8"/><circle cx="268" cy="88" r="0.8" opacity="0.4"/>
    <circle cx="312" cy="26" r="1.1" opacity="0.65"/><circle cx="352" cy="120" r="1" opacity="0.4"/>
    <circle cx="398" cy="60" r="1.4" opacity="0.72"/><circle cx="438" cy="34" r="0.9" opacity="0.5"/>
    <circle cx="474" cy="112" r="1" opacity="0.35"/><circle cx="516" cy="66" r="1.3" opacity="0.55"/>
    <circle cx="558" cy="28" r="1" opacity="0.5"/><circle cx="602" cy="94" r="0.8" opacity="0.28"/>
    <circle cx="646" cy="48" r="1.2" opacity="0.45"/><circle cx="690" cy="20" r="1" opacity="0.42"/>
    <circle cx="734" cy="76" r="0.9" opacity="0.26"/><circle cx="770" cy="40" r="1.1" opacity="0.34"/>
    <circle cx="66" cy="146" r="1" opacity="0.5"/><circle cx="124" cy="182" r="0.8" opacity="0.34"/>
    <circle cx="204" cy="160" r="1.1" opacity="0.42"/><circle cx="286" cy="196" r="0.9" opacity="0.3"/>
    <circle cx="360" cy="168" r="1" opacity="0.34"/><circle cx="446" cy="188" r="0.8" opacity="0.24"/>
    <circle cx="524" cy="152" r="0.9" opacity="0.26"/><circle cx="612" cy="176" r="0.8" opacity="0.18"/>
    <circle cx="18" cy="94" r="1" opacity="0.6"/><circle cx="262" cy="140" r="0.7" opacity="0.3"/>
    <circle cx="182" cy="220" r="0.7" opacity="0.24"/><circle cx="82" cy="242" r="0.8" opacity="0.28"/>
  </g>

  <!-- 밝은 별 셋 -->
  <g fill="#ffffff" filter="url(#starblur)">
    <circle cx="228" cy="52" r="2.6" opacity="0.75"/>
    <circle cx="398" cy="60" r="2.2" opacity="0.6"/>
    <circle cx="42" cy="38" r="2.4" opacity="0.7"/>
  </g>
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.45">
    <line x1="218" y1="52" x2="238" y2="52"/><line x1="228" y1="42" x2="228" y2="62"/>
  </g>

  <!-- 여명의 광원 -->
  <ellipse cx="608" cy="392" rx="118" ry="52" fill="#e9c48f" opacity="0.2" filter="url(#softblur)"/>
  <ellipse cx="608" cy="398" rx="52" ry="20" fill="#f6dcb2" opacity="0.28" filter="url(#softblur)"/>

  <!-- 먼 능선 -->
  <polygon points="0,352 88,318 158,340 244,300 322,336 400,308 486,344 560,320 648,348 736,326 800,346 800,420 0,420"
           fill="url(#ridge)" opacity="0.72"/>
  <polygon points="0,382 74,356 148,376 230,344 316,378 396,352 478,384 556,360 640,386 728,362 800,382 800,420 0,420"
           fill="#080f1c" opacity="0.86"/>

  <!-- 안개층. 잔잔하게 깔린 정체 -->
  <rect x="0" y="330" width="800" height="16" fill="url(#mist)" filter="url(#softblur)"/>
  <rect x="0" y="362" width="800" height="12" fill="url(#mist)" opacity="0.7" filter="url(#softblur)"/>

  <!-- 수면 -->
  <rect x="0" y="404" width="800" height="196" fill="url(#water)"/>
  <!-- 여명 반사. 오른쪽만 밝다 -->
  <g fill="#f0cf9c" opacity="0.2">
    <ellipse cx="608" cy="420" rx="70" ry="4"/>
    <ellipse cx="606" cy="440" rx="54" ry="3.4"/>
    <ellipse cx="610" cy="462" rx="62" ry="3"/>
    <ellipse cx="604" cy="486" rx="42" ry="2.6"/>
    <ellipse cx="612" cy="512" rx="52" ry="2.4"/>
    <ellipse cx="606" cy="542" rx="34" ry="2"/>
  </g>
  <!-- 왼쪽 수면. 거의 움직이지 않는다 -->
  <g fill="#7c98ab" opacity="0.1">
    <ellipse cx="176" cy="428" rx="96" ry="2.4"/>
    <ellipse cx="150" cy="458" rx="78" ry="2"/>
    <ellipse cx="190" cy="492" rx="86" ry="1.8"/>
    <ellipse cx="140" cy="528" rx="64" ry="1.6"/>
  </g>
  <g fill="#aebfcb" opacity="0.07">
    <ellipse cx="392" cy="436" rx="120" ry="2"/>
    <ellipse cx="408" cy="474" rx="104" ry="1.8"/>
    <ellipse cx="386" cy="516" rx="88" ry="1.6"/>
  </g>

  <!-- 하단 정착 -->
  <rect x="0" y="556" width="800" height="44" fill="#03060c" opacity="0.6"/>
</svg>
