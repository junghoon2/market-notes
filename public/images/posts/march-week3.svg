<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="30%" style="stop-color:#fed7aa"/>
      <stop offset="60%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#9a3412"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#431407"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="55%" r="12%">
      <stop offset="0%" style="stop-color:#fef9c3"/>
      <stop offset="40%" style="stop-color:#fde047"/>
      <stop offset="100%" style="stop-color:#fde047;stop-opacity:0"/>
    </radialGradient>
    <filter id="sunblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 하늘 -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 태양 글로우 -->
  <circle cx="400" cy="330" r="120" fill="#fde047" opacity="0.15" filter="url(#sunblur)"/>

  <!-- 태양 -->
  <circle cx="400" cy="330" r="52" fill="url(#sun)"/>
  <circle cx="400" cy="330" r="45" fill="#fef9c3" opacity="0.9"/>

  <!-- 구름 실루엣 -->
  <g fill="#fdba74" opacity="0.35">
    <ellipse cx="130" cy="180" rx="90" ry="28"/>
    <ellipse cx="100" cy="185" rx="50" ry="22"/>
    <ellipse cx="175" cy="183" rx="55" ry="20"/>
    <ellipse cx="620" cy="140" rx="110" ry="30"/>
    <ellipse cx="580" cy="147" rx="60" ry="24"/>
    <ellipse cx="670" cy="145" rx="65" ry="22"/>
    <ellipse cx="300" cy="220" rx="70" ry="20"/>
    <ellipse cx="500" cy="200" rx="80" ry="22"/>
  </g>

  <!-- 수평선 -->
  <rect x="0" y="325" width="800" height="3" fill="#fef08a" opacity="0.4"/>

  <!-- 물 -->
  <rect x="0" y="328" width="800" height="272" fill="url(#water)"/>

  <!-- 태양 반사 물결 -->
  <g fill="#fde047" opacity="0.5">
    <ellipse cx="400" cy="350" rx="80" ry="6"/>
    <ellipse cx="400" cy="370" rx="60" ry="4"/>
    <ellipse cx="400" cy="388" rx="45" ry="3"/>
    <ellipse cx="400" cy="403" rx="32" ry="2.5"/>
    <ellipse cx="400" cy="416" rx="22" ry="2"/>
    <ellipse cx="400" cy="427" rx="15" ry="1.5"/>
  </g>

  <!-- 물결 라인 -->
  <g stroke="#c2410c" stroke-width="1" fill="none" opacity="0.3">
    <path d="M0,400 Q100,393 200,400 Q300,407 400,400 Q500,393 600,400 Q700,407 800,400"/>
    <path d="M0,430 Q120,423 240,430 Q360,437 480,430 Q600,423 800,430"/>
    <path d="M0,460 Q150,453 300,460 Q450,467 600,460 Q700,455 800,460"/>
    <path d="M0,490 Q100,483 200,490 Q400,497 600,490 Q700,485 800,490"/>
    <path d="M0,520 Q200,513 400,520 Q600,527 800,520"/>
  </g>

  <!-- 새 실루엣 -->
  <g fill="none" stroke="#431407" stroke-width="1.5" opacity="0.6">
    <path d="M160,120 Q168,115 176,120"/>
    <path d="M190,108 Q200,102 210,108"/>
    <path d="M240,130 Q248,124 256,130"/>
    <path d="M560,100 Q570,94 580,100"/>
    <path d="M600,115 Q608,109 616,115"/>
  </g>
</svg>
