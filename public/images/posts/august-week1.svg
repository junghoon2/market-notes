<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 재편의 밤: 큰 별 하나가 지고 여러 별이 새로 오르는 하늘 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#05080f"/>
      <stop offset="26%" style="stop-color:#0b1220"/>
      <stop offset="54%" style="stop-color:#141e33"/>
      <stop offset="74%" style="stop-color:#1d2b45"/>
      <stop offset="100%" style="stop-color:#03050a"/>
    </linearGradient>
    <!-- 지는 별(전량 매도): 수평선으로 내려앉는 잔광 -->
    <radialGradient id="setting" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.7"/>
      <stop offset="34%" style="stop-color:#f59e0b;stop-opacity:0.34"/>
      <stop offset="70%" style="stop-color:#b45309;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:0"/>
    </radialGradient>
    <!-- 새로 오르는 별들(빅테크 분산): 차가운 청록 후광 -->
    <radialGradient id="rising" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.92"/>
      <stop offset="32%" style="stop-color:#a5f3fc;stop-opacity:0.46"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </radialGradient>
    <!-- 대기 자금(현금): 아직 불이 켜지지 않은 옅은 후광 -->
    <radialGradient id="pending" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:0.34"/>
      <stop offset="55%" style="stop-color:#64748b;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#334155;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="ridge1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#25384f"/>
      <stop offset="100%" style="stop-color:#0a1220"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14203a"/>
      <stop offset="100%" style="stop-color:#05080f"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3346;stop-opacity:0.85"/>
      <stop offset="45%" style="stop-color:#0c1826;stop-opacity:0.72"/>
      <stop offset="100%" style="stop-color:#02050a;stop-opacity:0.95"/>
    </linearGradient>
    <filter id="softblur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="starblur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="lineblur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 옅은 성운: 재편 중인 하늘 -->
  <ellipse cx="300" cy="150" rx="280" ry="96" fill="#101d33" opacity="0.5" filter="url(#softblur)"/>
  <ellipse cx="620" cy="230" rx="220" ry="80" fill="#122437" opacity="0.4" filter="url(#softblur)"/>

  <!-- 배경 별 -->
  <g fill="#e2e8f0">
    <circle cx="54" cy="42" r="1.0" opacity="0.44"/>
    <circle cx="102" cy="98" r="0.8" opacity="0.3"/>
    <circle cx="146" cy="52" r="1.2" opacity="0.55"/>
    <circle cx="192" cy="128" r="0.9" opacity="0.32"/>
    <circle cx="236" cy="70" r="1.1" opacity="0.48"/>
    <circle cx="284" cy="36" r="0.8" opacity="0.28"/>
    <circle cx="330" cy="110" r="1.3" opacity="0.58"/>
    <circle cx="376" cy="60" r="0.9" opacity="0.34"/>
    <circle cx="418" cy="140" r="1.0" opacity="0.42"/>
    <circle cx="462" cy="88" r="0.8" opacity="0.3"/>
    <circle cx="506" cy="46" r="1.2" opacity="0.52"/>
    <circle cx="552" cy="120" r="0.9" opacity="0.33"/>
    <circle cx="598" cy="66" r="1.0" opacity="0.44"/>
    <circle cx="644" cy="146" r="0.8" opacity="0.28"/>
    <circle cx="690" cy="94" r="1.1" opacity="0.5"/>
    <circle cx="736" cy="44" r="0.9" opacity="0.34"/>
    <circle cx="774" cy="126" r="1.0" opacity="0.4"/>
    <circle cx="76" cy="170" r="0.9" opacity="0.34"/>
    <circle cx="128" cy="214" r="1.1" opacity="0.46"/>
    <circle cx="182" cy="186" r="0.8" opacity="0.26"/>
    <circle cx="240" cy="230" r="1.0" opacity="0.4"/>
    <circle cx="296" cy="196" r="0.9" opacity="0.3"/>
    <circle cx="352" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="410" cy="204" r="0.8" opacity="0.26"/>
    <circle cx="468" cy="246" r="1.0" opacity="0.38"/>
    <circle cx="524" cy="212" r="0.9" opacity="0.3"/>
    <circle cx="580" cy="252" r="1.1" opacity="0.44"/>
    <circle cx="638" cy="200" r="0.8" opacity="0.26"/>
    <circle cx="696" cy="244" r="1.0" opacity="0.4"/>
    <circle cx="752" cy="208" r="0.9" opacity="0.3"/>
    <circle cx="44" cy="266" r="0.8" opacity="0.24"/>
    <circle cx="164" cy="288" r="0.9" opacity="0.26"/>
    <circle cx="292" cy="304" r="0.8" opacity="0.22"/>
    <circle cx="432" cy="292" r="0.9" opacity="0.25"/>
    <circle cx="566" cy="310" r="0.8" opacity="0.22"/>
    <circle cx="700" cy="296" r="0.9" opacity="0.24"/>
  </g>

  <!-- 지는 별: 수평선 가까이 내려앉은 큰 잔광 -->
  <circle cx="188" cy="372" r="104" fill="url(#setting)" opacity="0.9"/>
  <circle cx="188" cy="372" r="6.4" fill="#fde68a" filter="url(#starblur)" opacity="0.85"/>
  <circle cx="188" cy="372" r="3.0" fill="#fff7ed" opacity="0.9"/>
  <g stroke="#fcd34d" stroke-width="1" opacity="0.4" filter="url(#lineblur)">
    <line x1="188" y1="340" x2="188" y2="404"/>
    <line x1="152" y1="372" x2="224" y2="372"/>
  </g>

  <!-- 새로 오르는 별 4개: 크기를 달리해 비중 차이를 표현 -->
  <g>
    <circle cx="486" cy="186" r="40" fill="url(#rising)" opacity="0.85"/>
    <circle cx="486" cy="186" r="3.2" fill="#ffffff" filter="url(#starblur)"/>
    <circle cx="486" cy="186" r="1.8" fill="#ffffff"/>
    <g stroke="#e0f9ff" stroke-width="1" opacity="0.62" filter="url(#lineblur)">
      <line x1="486" y1="166" x2="486" y2="206"/>
      <line x1="466" y1="186" x2="506" y2="186"/>
    </g>
  </g>
  <g>
    <circle cx="588" cy="252" r="32" fill="url(#rising)" opacity="0.72"/>
    <circle cx="588" cy="252" r="2.6" fill="#ffffff" filter="url(#starblur)"/>
    <circle cx="588" cy="252" r="1.5" fill="#ffffff"/>
    <g stroke="#e0f9ff" stroke-width="0.9" opacity="0.5" filter="url(#lineblur)">
      <line x1="588" y1="236" x2="588" y2="268"/>
      <line x1="572" y1="252" x2="604" y2="252"/>
    </g>
  </g>
  <g>
    <circle cx="670" cy="164" r="26" fill="url(#rising)" opacity="0.62"/>
    <circle cx="670" cy="164" r="2.2" fill="#ffffff" filter="url(#starblur)"/>
    <circle cx="670" cy="164" r="1.3" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="404" cy="268" r="22" fill="url(#rising)" opacity="0.54"/>
    <circle cx="404" cy="268" r="2.0" fill="#ffffff" filter="url(#starblur)"/>
    <circle cx="404" cy="268" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 대기 자금: 아직 밝아지지 않은 자리 3개 -->
  <circle cx="534" cy="330" r="30" fill="url(#pending)"/>
  <circle cx="642" cy="352" r="24" fill="url(#pending)"/>
  <circle cx="718" cy="288" r="20" fill="url(#pending)"/>

  <!-- 수평선 잔광 -->
  <ellipse cx="330" cy="426" rx="440" ry="120" fill="url(#setting)" opacity="0.28"/>
  <rect x="0" y="420" width="800" height="2.5" fill="#fcd34d" opacity="0.3" filter="url(#lineblur)"/>

  <!-- 능선 2겹 -->
  <polygon points="0,420 88,364 166,392 252,336 334,386 400,352 470,394 552,340 638,384 720,348 800,396 800,432 0,432"
           fill="url(#ridge1)" opacity="0.95"/>
  <polygon points="0,432 78,404 162,424 248,394 332,420 424,398 514,422 606,398 692,422 800,404 800,446 0,446"
           fill="url(#ridge2)" opacity="0.9"/>

  <!-- 수면 + 반사 -->
  <rect x="0" y="442" width="800" height="158" fill="url(#water)"/>
  <ellipse cx="188" cy="474" rx="86" ry="10" fill="#fbbf24" opacity="0.26" filter="url(#lineblur)"/>
  <ellipse cx="188" cy="508" rx="60" ry="7" fill="#f59e0b" opacity="0.16" filter="url(#lineblur)"/>
  <ellipse cx="486" cy="480" rx="42" ry="6" fill="#a5f3fc" opacity="0.24" filter="url(#lineblur)"/>
  <ellipse cx="588" cy="502" rx="32" ry="5" fill="#a5f3fc" opacity="0.18" filter="url(#lineblur)"/>
  <ellipse cx="670" cy="470" rx="24" ry="4" fill="#a5f3fc" opacity="0.14" filter="url(#lineblur)"/>

  <!-- 잔물결: 남아 있는 변동성 -->
  <g stroke="#7dd3fc" stroke-width="1" opacity="0.15">
    <line x1="92" y1="464" x2="242" y2="464"/>
    <line x1="486" y1="468" x2="648" y2="468"/>
    <line x1="54" y1="496" x2="204" y2="496"/>
    <line x1="428" y1="502" x2="606" y2="502"/>
    <line x1="136" y1="530" x2="318" y2="530"/>
    <line x1="520" y1="538" x2="694" y2="538"/>
    <line x1="78" y1="564" x2="276" y2="564"/>
    <line x1="454" y1="572" x2="650" y2="572"/>
  </g>

  <!-- 하단 감쇠 -->
  <rect x="0" y="542" width="800" height="58" fill="#02050a" opacity="0.5"/>
</svg>
