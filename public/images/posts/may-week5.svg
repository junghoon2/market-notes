<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120"/>
      <stop offset="30%" style="stop-color:#134e4a"/>
      <stop offset="58%" style="stop-color:#0d9488"/>
      <stop offset="80%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fcd34d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="72%" r="32%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#fcd34d;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#fffbeb;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:0.7"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#0f766e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:0.55"/>
    </linearGradient>
    <linearGradient id="peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3b39"/>
      <stop offset="100%" style="stop-color:#0b1120"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 태양 후광 -->
  <ellipse cx="410" cy="430" rx="360" ry="210" fill="url(#sun)" filter="url(#glow)"/>
  <ellipse cx="410" cy="430" rx="190" ry="115" fill="#fffbeb" opacity="0.16" filter="url(#glow)"/>

  <!-- 별 (상단 어두운 영역) -->
  <g fill="white">
    <circle cx="55" cy="32" r="1.0" opacity="0.7"/>
    <circle cx="125" cy="20" r="0.8" opacity="0.6"/>
    <circle cx="205" cy="48" r="1.2" opacity="0.8"/>
    <circle cx="285" cy="26" r="0.7" opacity="0.5"/>
    <circle cx="365" cy="40" r="0.9" opacity="0.6"/>
    <circle cx="455" cy="18" r="1.1" opacity="0.7"/>
    <circle cx="535" cy="52" r="0.8" opacity="0.5"/>
    <circle cx="615" cy="28" r="1.3" opacity="0.8"/>
    <circle cx="695" cy="46" r="0.9" opacity="0.6"/>
    <circle cx="755" cy="24" r="1.0" opacity="0.7"/>
    <circle cx="90" cy="78" r="0.7" opacity="0.5"/>
    <circle cx="175" cy="92" r="1.0" opacity="0.6"/>
    <circle cx="330" cy="82" r="0.8" opacity="0.4"/>
    <circle cx="505" cy="88" r="0.9" opacity="0.5"/>
    <circle cx="640" cy="74" r="1.1" opacity="0.6"/>
    <circle cx="735" cy="92" r="0.7" opacity="0.4"/>
    <circle cx="250" cy="120" r="0.8" opacity="0.4"/>
    <circle cx="560" cy="130" r="0.9" opacity="0.45"/>
  </g>

  <!-- 밝은 별 -->
  <g fill="white" filter="url(#starblur)">
    <circle cx="205" cy="48" r="2.2" opacity="0.9"/>
    <circle cx="615" cy="28" r="2.5" opacity="0.9"/>
    <circle cx="455" cy="18" r="2.0" opacity="0.8"/>
  </g>

  <!-- 십자형 별빛 -->
  <g stroke="white" stroke-width="0.6" opacity="0.5">
    <line x1="615" y1="21" x2="615" y2="35"/>
    <line x1="608" y1="28" x2="622" y2="28"/>
  </g>

  <!-- 구름 띠 -->
  <g opacity="0.5">
    <ellipse cx="190" cy="175" rx="120" ry="22" fill="#5eead4" opacity="0.28"/>
    <ellipse cx="610" cy="158" rx="130" ry="20" fill="#5eead4" opacity="0.24"/>
    <ellipse cx="150" cy="245" rx="100" ry="18" fill="#fbbf24" opacity="0.22"/>
    <ellipse cx="660" cy="235" rx="110" ry="16" fill="#fbbf24" opacity="0.22"/>
    <ellipse cx="360" cy="295" rx="150" ry="14" fill="#fcd34d" opacity="0.2"/>
  </g>

  <!-- 원경 능선 -->
  <polygon points="0,430 90,380 180,405 270,360 360,388 460,345 560,372 660,335 760,365 800,380 800,500 0,500" fill="url(#ridge)" opacity="0.75"/>

  <!-- 떠오르는 태양 (정상 뒤) -->
  <ellipse cx="410" cy="372" rx="52" ry="52" fill="url(#suncore)"/>
  <ellipse cx="410" cy="372" rx="68" ry="68" fill="#fcd34d" opacity="0.3" filter="url(#softglow)"/>

  <!-- 가파른 상승 빛줄기 (폭등 메타포) -->
  <g stroke="#fffbeb" stroke-width="1.2" opacity="0.18">
    <line x1="410" y1="372" x2="80" y2="250"/>
    <line x1="410" y1="372" x2="190" y2="210"/>
    <line x1="410" y1="372" x2="300" y2="180"/>
    <line x1="410" y1="372" x2="410" y2="160"/>
    <line x1="410" y1="372" x2="520" y2="180"/>
    <line x1="410" y1="372" x2="630" y2="210"/>
    <line x1="410" y1="372" x2="740" y2="250"/>
  </g>

  <!-- 우뚝 솟은 정상 봉우리 (정상 임박) -->
  <polygon points="0,520 120,470 250,430 410,300 560,420 690,460 800,500 800,600 0,600" fill="url(#peak)"/>

  <!-- 정상 빛 반사 (설산) -->
  <polygon points="410,300 392,345 432,345" fill="#fcd34d" opacity="0.28"/>
  <polygon points="250,430 268,402 288,430" fill="#fcd34d" opacity="0.16"/>
  <polygon points="560,420 580,392 600,420" fill="#fcd34d" opacity="0.16"/>

  <!-- 물 반사 -->
  <rect x="0" y="500" width="800" height="100" fill="url(#water)"/>
  <ellipse cx="410" cy="525" rx="210" ry="14" fill="#fcd34d" opacity="0.26"/>
  <ellipse cx="410" cy="545" rx="140" ry="8" fill="#fffbeb" opacity="0.15"/>
  <ellipse cx="410" cy="563" rx="80" ry="5" fill="#fcd34d" opacity="0.1"/>

  <!-- 전경 나무 실루엣 -->
  <g fill="#020617">
    <polygon points="18,600 33,524 48,600"/>
    <polygon points="48,600 66,512 84,600"/>
    <polygon points="712,600 730,518 748,600"/>
    <polygon points="746,600 763,506 780,600"/>
    <polygon points="776,600 791,528 806,600"/>
  </g>
</svg>
