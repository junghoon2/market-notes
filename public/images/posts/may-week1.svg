<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b132b"/>
      <stop offset="35%" style="stop-color:#1c2541"/>
      <stop offset="70%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="40%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#042f2e"/>
    </linearGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#fde68a;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.7"/>
    </radialGradient>
    <radialGradient id="sunhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:0.7"/>
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="reflectglow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" style="stop-color:#fde68a;stop-opacity:0.55"/>
      <stop offset="60%" style="stop-color:#fbbf24;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fde68a;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="starblur">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- 하늘 배경 -->
  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- 바다 배경 (반사) -->
  <rect y="300" width="800" height="300" fill="url(#ocean)"/>

  <!-- 별 (어두운 상단) -->
  <g fill="#e0f2fe">
    <circle cx="60" cy="35" r="1.0" opacity="0.7"/>
    <circle cx="130" cy="22" r="0.8" opacity="0.55"/>
    <circle cx="210" cy="55" r="1.2" opacity="0.85"/>
    <circle cx="280" cy="28" r="0.7" opacity="0.5"/>
    <circle cx="370" cy="48" r="0.9" opacity="0.6"/>
    <circle cx="445" cy="20" r="1.1" opacity="0.8"/>
    <circle cx="520" cy="60" r="0.8" opacity="0.5"/>
    <circle cx="600" cy="32" r="1.3" opacity="0.85"/>
    <circle cx="680" cy="50" r="0.9" opacity="0.6"/>
    <circle cx="755" cy="25" r="1.0" opacity="0.7"/>
    <circle cx="100" cy="90" r="0.7" opacity="0.5"/>
    <circle cx="180" cy="105" r="1.0" opacity="0.6"/>
    <circle cx="320" cy="95" r="0.8" opacity="0.45"/>
    <circle cx="490" cy="100" r="0.9" opacity="0.55"/>
    <circle cx="640" cy="85" r="1.1" opacity="0.65"/>
    <circle cx="730" cy="105" r="0.7" opacity="0.45"/>
    <circle cx="40" cy="130" r="0.8" opacity="0.4"/>
    <circle cx="240" cy="140" r="0.9" opacity="0.45"/>
    <circle cx="560" cy="135" r="0.8" opacity="0.4"/>
    <circle cx="700" cy="155" r="1.0" opacity="0.5"/>
  </g>

  <!-- 밝은 별 (100% 돌파 상징) -->
  <g fill="#fef3c7" filter="url(#starblur)">
    <circle cx="445" cy="20" r="2.6" opacity="0.95"/>
    <circle cx="600" cy="32" r="2.2" opacity="0.9"/>
    <circle cx="210" cy="55" r="2.0" opacity="0.85"/>
  </g>

  <!-- 십자형 별빛 -->
  <g stroke="#fef3c7" stroke-width="0.7" opacity="0.55">
    <line x1="445" y1="11" x2="445" y2="29"/>
    <line x1="436" y1="20" x2="454" y2="20"/>
    <line x1="600" y1="24" x2="600" y2="40"/>
    <line x1="592" y1="32" x2="608" y2="32"/>
  </g>

  <!-- 5주 연속 상승 — 빛 기둥 5개 -->
  <g>
    <rect x="155" y="60" width="14" height="240" fill="url(#beam)" opacity="0.6"/>
    <rect x="285" y="40" width="14" height="260" fill="url(#beam)" opacity="0.7"/>
    <rect x="415" y="20" width="14" height="280" fill="url(#beam)" opacity="0.85"/>
    <rect x="545" y="40" width="14" height="260" fill="url(#beam)" opacity="0.7"/>
    <rect x="675" y="60" width="14" height="240" fill="url(#beam)" opacity="0.6"/>
  </g>

  <!-- 태양 후광 -->
  <ellipse cx="400" cy="260" rx="320" ry="100" fill="url(#sunhalo)" filter="url(#glow)"/>

  <!-- 수평선 (반사 거울) -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#fde68a" stroke-width="0.6" opacity="0.5"/>

  <!-- 태양 (수평선 위) -->
  <circle cx="400" cy="265" r="58" fill="url(#suncore)"/>
  <circle cx="400" cy="265" r="78" fill="#fbbf24" opacity="0.28" filter="url(#softglow)"/>

  <!-- 태양 반사 (수평선 아래, 100% = 두 배 메타포) -->
  <ellipse cx="400" cy="335" rx="58" ry="22" fill="#fde68a" opacity="0.6"/>
  <ellipse cx="400" cy="345" rx="48" ry="14" fill="#fbbf24" opacity="0.4"/>

  <!-- 수면 빛줄기 (반사 글로우) -->
  <ellipse cx="400" cy="320" rx="320" ry="90" fill="url(#reflectglow)"/>

  <!-- 수면 잔물결 -->
  <g stroke="#fde68a" stroke-width="0.8" opacity="0.45" fill="none">
    <ellipse cx="400" cy="370" rx="240" ry="6"/>
    <ellipse cx="400" cy="395" rx="200" ry="5"/>
    <ellipse cx="400" cy="425" rx="160" ry="4"/>
    <ellipse cx="400" cy="455" rx="120" ry="3.5"/>
    <ellipse cx="400" cy="485" rx="85" ry="3"/>
    <ellipse cx="400" cy="515" rx="55" ry="2.5"/>
  </g>

  <!-- 측면 잔물결 (어두운 톤) -->
  <g stroke="#0f766e" stroke-width="1" opacity="0.5" fill="none">
    <line x1="60" y1="385" x2="170" y2="385"/>
    <line x1="630" y1="385" x2="740" y2="385"/>
    <line x1="40" y1="425" x2="180" y2="425"/>
    <line x1="620" y1="425" x2="760" y2="425"/>
    <line x1="20" y1="475" x2="200" y2="475"/>
    <line x1="600" y1="475" x2="780" y2="475"/>
    <line x1="0" y1="525" x2="220" y2="525"/>
    <line x1="580" y1="525" x2="800" y2="525"/>
  </g>

  <!-- 원경 산 실루엣 -->
  <polygon points="0,300 90,265 180,290 280,255 380,278 480,250 580,280 680,255 770,283 800,275 800,300 0,300" fill="#0b132b" opacity="0.85"/>

  <!-- 전경 어둠 (하단 페이드) -->
  <rect x="0" y="555" width="800" height="45" fill="#042f2e" opacity="0.7"/>
</svg>
