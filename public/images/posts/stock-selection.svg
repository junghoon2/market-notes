<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 투자철학 골드 테마: 짙은 남청 → 호박빛 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161009"/>
      <stop offset="55%" stop-color="#2e2310"/>
      <stop offset="100%" stop-color="#7a5320"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#f5d98b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f5d98b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f5d98b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- 옅은 격자 -->
  <g stroke="#d9a441" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>

  <!-- 이익 우상향 라인 -->
  <polyline points="80,470 200,440 320,400 440,330 560,250 700,140"
            fill="none" stroke="url(#line)" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#f5d98b">
    <circle cx="80" cy="470" r="7"/>
    <circle cx="200" cy="440" r="7"/>
    <circle cx="320" cy="400" r="7"/>
    <circle cx="440" cy="330" r="7"/>
    <circle cx="560" cy="250" r="7"/>
    <circle cx="700" cy="140" r="9"/>
  </g>

  <!-- 수식 -->
  <text x="80" y="120"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="64" font-weight="700" fill="#f5d98b">Y = aX + C</text>
  <text x="82" y="170"
        font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="26" fill="#d9a441" fill-opacity="0.85">핵심은 X, 이익이다</text>
</svg>
