<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="50%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fca5a5;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- 노이즈 레이어 - 대각선 줄 -->
  <g opacity="0.08">
    <line x1="-100" y1="0" x2="900" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="30" x2="900" y2="30" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="60" x2="900" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="90" x2="900" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="120" x2="900" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="150" x2="900" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="180" x2="900" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="210" x2="900" y2="210" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="240" x2="900" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="270" x2="900" y2="270" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="300" x2="900" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="330" x2="900" y2="330" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="360" x2="900" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="390" x2="900" y2="390" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="420" x2="900" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="450" x2="900" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="480" x2="900" y2="480" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="510" x2="900" y2="510" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="540" x2="900" y2="540" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="570" x2="900" y2="570" stroke="#fff" stroke-width="1"/>
    <line x1="-100" y1="600" x2="900" y2="600" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- 급락 차트 라인 -->
  <polyline
    points="60,100 130,110 200,120 260,115 310,130 360,200 400,320 430,380 450,420 470,400 500,380 540,360 580,340 620,320 670,300 730,280 800,270"
    fill="none" stroke="#fca5a5" stroke-width="2.5" opacity="0.9" filter="url(#glow)"
  />

  <!-- 보조 차트 라인 -->
  <polyline
    points="60,160 130,165 200,170 260,168 310,180 360,240 400,340 430,390 450,430 470,415 500,400 540,385 580,370 620,355 670,340 730,325 800,315"
    fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.3"
  />

  <!-- 하락 강조 수직선 -->
  <line x1="450" y1="80" x2="450" y2="520" stroke="#ef4444" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>

  <!-- -35% 텍스트 -->
  <text x="460" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ef4444" opacity="0.25">-35%</text>

  <!-- 회복 화살표 영역 -->
  <rect x="470" y="280" width="310" height="3" fill="#fca5a5" opacity="0.4"/>

  <!-- 하단 장식선 -->
  <line x1="0" y1="570" x2="800" y2="570" stroke="#fca5a5" stroke-width="0.5" opacity="0.3"/>
</svg>
